<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#100D0A" />
    <title>RePulse</title>

    <!-- Reads the saved theme before the first paint. ThemeProvider sets
         the same attribute a moment later; without this the boot screen
         below is dark for that moment, and a light-mode user gets a black
         flash on every launch. Inline and synchronous on purpose. -->
    <script>
      try {
        var t = localStorage.getItem("repulse_theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        /* private mode — dark is the default anyway */
      }
    </script>

    <style>
      /* Paint the background before CSS loads — no white flash. The two
         values are --color-base for each theme, copied because tokens.css
         has not loaded yet. */
      html {
        background: #100d0a;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background: #f4efe6;
        color-scheme: light;
      }
      /* Not an inline style on the element: an inline background would
         win over the light rule below. */
      #boot {
        background: #100d0a;
      }
      html[data-theme="light"] #boot {
        background: #f4efe6;
      }
      /* --color-ivory, light */
      html[data-theme="light"] #boot svg {
        stroke: #1c1611;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:0 3rem;">
        <div style="width:100%;max-width:220px;">
          <svg viewBox="-2 -2 384 104" fill="none" stroke="#ede3d6" stroke-width="4" stroke-linecap="butt" style="display:block;width:100%;height:auto;">
            <g transform="translate(0 0)"><path d="M2 0V100" /><path d="M2 2H36A25 25 0 0 1 36 52H2" /><path d="M26 56L58 100" /></g>
            <g transform="translate(90 0)"><path d="M2 0V100" /><path d="M2 2H52" /><path d="M16 50H46" /><path d="M2 98H52" /></g>
            <g transform="translate(174 0)"><path d="M2 0V100" /><path d="M14 2H36A25 25 0 0 1 36 52H14" /></g>
            <g transform="translate(264 0)"><path d="M2 0V60" /><path d="M2 70A29 30 0 0 0 60 70" /><path d="M60 0V70" /></g>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
